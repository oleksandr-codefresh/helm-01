gitops-runtime:
  redis-ha:
    enabled: true
    hardAntiAffinity: false
    # nameOverride: runtime-redis
    haproxy:
      hardAntiAffinity: false
  app-proxy:
    replicaCount: 2
    config:
      cors: http://local.codefresh.io
      graphqlPlayground: 'true'
  argo-cd:
    redis-ha:
      enabled: true
      hardAntiAffinity: false
      # nameOverride: runtime-redis
      haproxy:
        hardAntiAffinity: false
    configs:
      cm:
        accounts.admin: apiKey,login
      params:
        controller.log.level: debug
        server.basehref: /argocd
        server.insecure: true
        server.rootpath: /argocd
    extraObjects:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: HTTP
          name: runtime-ingress
        spec:
          ingressClassName: nginx
          rules:
            - http:
                paths:
                  - backend:
                      service:
                        name: argo-cd-server
                        port:
                          number: 80
                    path: /argocd
                    pathType: Prefix
                  - backend:
                      service:
                        name: internal-router
                        port:
                          number: 80
                    path: /webhooks
                    pathType: Prefix
                  - backend:
                      service:
                        name: internal-router
                        port:
                          number: 80
                    path: /workflows
                    pathType: Prefix
                  - backend:
                      service:
                        name: internal-router
                        port:
                          number: 80
                    path: /app-proxy
                    pathType: Prefix
  argo-workflows:
    controller:
      workflowDefaults:
        spec:
          archiveLogs: true
          artifactRepositoryRef:
            configMap: codefresh-workflows-log-store
            key: codefresh-workflows-log-store
  global:
    codefresh:
      accountId: 67bca12b5e470fc3eecfdfb7
      url: https://alexs-platform.ngrok.io
      userToken:
        secretKeyRef:
          name: codefresh-user-token
          key: token
    runtime:
      ingress:
        enabled: false
      ingressUrl: http://runtimes.local.com:7711
      name: rt-plain
  installer:
    skipValidation: true
  tunnel-client:
    enabled: false
